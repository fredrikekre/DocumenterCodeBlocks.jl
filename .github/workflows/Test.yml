---
name: Test
on:
  push:
    branches:
      - 'main'
      - 'release-'
    tags:
      - '*'
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    name: Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        julia-version:
          - '1.10'
          - '1'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: false
  playwright:
    name: Playwright browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Build the test docsite
        run: |
          julia --project=test/docsite -e 'import Pkg; Pkg.instantiate()'
          julia --project=test/docsite test/docsite/make.jl
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        working-directory: test/playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run browser test suites
        working-directory: test/playwright
        run: |
          python3 -m http.server 8907 -d ../docsite/build &
          for i in $(seq 1 20); do curl -sf -o /dev/null http://localhost:8907/ && break; sleep 0.5; done
          node verify.js http://localhost:8907/zoo/
          node verify-popup.js http://localhost:8907/references/
